name: Sync txsports-ad-clean
on:
  schedule:
    - cron: "37 */6 * * *"   # every 6 hours
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Convert upstream QX snippet + JS to Loon
        run: python3 Scripts/convert_txsports.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- txsports-ad-clean.plugin Scripts/txsports-ad-clean.js; then echo "no change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add txsports-ad-clean.plugin Scripts/txsports-ad-clean.js
          git commit -m "sync: txsports-ad-clean from upstream"
          git pull --rebase
          git push
